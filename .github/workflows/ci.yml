# CI de PR: valida el despliegue y ejecuta los tests antes de mergear a main.
# Las actions van fijadas por SHA y en la última release con 14 días o más (regla del proyecto).
# Sin secretos y sin acceso a AWS: solo lee el repositorio.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests y validación de despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Validar amplify.yml
        run: npm run check:deploy

      - name: Plantilla de correo al día
        run: npm run check:email

      - name: Tests (build y Playwright contra dist/ con la CSP real)
        run: npm test

      # Informativo de momento: los avisos del detector no bloquean el PR (línea base en DESIGN.md).
      - name: Detector de Impeccable
        run: npm run detect
        continue-on-error: true

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (2026-10-07)
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
