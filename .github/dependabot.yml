# Solo actualiza las actions de los workflows. Las dependencias de npm no se tocan aquí.
# Regla de 14 días: no se propone una versión hasta que lleve 14 días publicada.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci(deps)
    cooldown:
      default-days: 14
